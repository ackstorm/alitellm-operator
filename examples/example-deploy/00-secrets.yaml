#
# WARNING: DO NOT commit real key values into this file.
# Create Secrets imperatively:
#
#   kubectl create secret generic litellm-master-key \
#     --from-literal=LITELLM_MASTER_KEY=$REAL_KEY -n default
#   kubectl create secret generic openai-api-key \
#     --from-literal=OPENAI_API_KEY=$REAL_KEY -n default
#   kubectl create secret generic anthropic-api-key \
#     --from-literal=ANTHROPIC_API_KEY=$REAL_KEY -n default
#
# The placeholder Secrets below are provided for schema reference only.
# The operator will not start reconciling Model/ModelDiscovery until the
# LiteLLMConnection is Ready, which requires a valid litellm-master-key.
#
# Alternatively, use Sealed Secrets or an external secrets operator
# (e.g. External Secrets Operator) to populate these from a vault. The
# operator only requires the standard corev1.Secret API.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-master-key
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # PLACEHOLDER — replace with actual key before applying.
  # The operator's LiteLLMConnection/default reads this Secret key to
  # authenticate against LiteLLM's REST API.
  LITELLM_MASTER_KEY: "PLACEHOLDER_DO_NOT_COMMIT"
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-api-key
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # PLACEHOLDER — replace with actual key before applying.
  # Required by ModelDiscovery/openai (03-modeldiscovery.yaml) to call
  # the OpenAI /v1/models endpoint for provider-side discovery.
  OPENAI_API_KEY: "PLACEHOLDER_DO_NOT_COMMIT"
---
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # PLACEHOLDER — replace with actual key before applying.
  # Required by Model/claude-sonnet-4-5 (02-model.yaml) for the
  # {{ANTHROPIC_API_KEY}} placeholder substitution in spec.params.
  ANTHROPIC_API_KEY: "PLACEHOLDER_DO_NOT_COMMIT"
