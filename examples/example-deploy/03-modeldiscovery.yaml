# Dogfood ModelDiscovery CR — OpenAI provider (Pipeline B).
#
# Exercises spec §11 AC-MD1 (provider-side discovery generates K8s Model
# children) and AC-FILT1 (include filter selects specific model families).
# This CR drives the Pipeline B path: discovery calls GET /v1/models
# against OpenAI and emits K8s Model child CRs for matching names; the
# Model controller then reconciles each child into LiteLLM via Pipeline A.
#
# After apply, expect:
#   (a) status.conditions[type=Ready].status=True within 30s once
#       credentialsSecretRef is resolvable and OpenAI is reachable.
#   (b) Generated child Model CRs named "openai.gpt-4o*" and
#       "openai.gpt-4.1*" appearing in default within 30s.
#   (c) status.generatedCount > 0; status.generatedChildren[] lists the
#       child CR names.
#   (d) Refresh every 10m (spec.refresh.interval floor = 1m per MDISC-05).
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMModelDiscovery
metadata:
  name: openai
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  # Provider type — governs which provider client is instantiated.
  # CEL enforces type ∈ {anthropic, bedrock, gemini, kubeai, openai}.
  type: openai
  # Provider credentials — read at reconcile-time from this Secret.
  # ONLY used for the operator's GET /v1/models call; NEVER injected
  # into generated child Model spec.params (MDISC-15).
  credentialsSecretRef:
    name: openai-api-key
  # Default baseUrl (https://api.openai.com/v1) used; no override needed.
  # To use OpenAI-compatible providers (vLLM, Together, Groq, etc.),
  # uncomment and set spec.baseUrl to the provider's /v1 endpoint.
  # baseUrl: https://api.together.xyz/v1
  # RE2 include filter — only gpt-4o and gpt-4.1 model families.
  # include-strict semantics: zero matches → Ready=False, reason=UpstreamInvalid.
  # exclude-lenient semantics: zero matches is silent.
  filters:
    include:
      - "gpt-4o.*"
      - "gpt-4\\.1.*"
    # Optional: canonical-only pattern. Uncomment to drop dated OpenAI
    # variants (gpt-4o-mini-2024-07-18, gpt-4.1-mini-2025-04-14, ...) and
    # keep only the rolling aliases (gpt-4o, gpt-4o-mini, gpt-4.1, ...).
    # Matches the pre-filter that ackstorm-litellm-autoconfig (the Python
    # predecessor) applies. On 2026-05-22 EKS smoke-test this dropped the
    # OpenAI child set from 117 → 49, parity 1:1 with autoconfig
    # (FIX.txt LOW-6).
    # exclude:
    #   - ".*[0-9]$"
  # Refresh interval — must be >= 1m (MDISC-05 CEL floor).
  refresh:
    interval: 10m
---
# Anthropic provider — GET /v1/models against api.anthropic.com.
#
# The Anthropic catalogue mixes rolling aliases (claude-opus-4-6,
# claude-sonnet-4-6) and dated snapshots (claude-opus-4-5-20251101).
# `exclude: [".*-[0-9]{8}$"]` keeps the rolling aliases only — verified
# 2026-05-22 EKS smoke-test: 9 → 3 children (opus-4-6, opus-4-7,
# sonnet-4-6). Note this regex is provider-specific: Anthropic encodes
# the date as a `-YYYYMMDD` suffix, NOT the OpenAI "last char is a
# digit" pattern. Do NOT cargo-cult `.*[0-9]$` here — every Anthropic
# alias ends in a digit, so that pattern excludes 9/9.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMModelDiscovery
metadata:
  name: anthropic
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  type: anthropic
  # Child names are prefixed: "anthropic.claude-opus-4-7". To drop the
  # prefix entirely and surface the bare normalized ID ("claude-opus-4-7"),
  # set `disablePrefix: true` and REMOVE `prefix:` (the two are mutually
  # exclusive — CEL rejects both at admission). Prefix-less names risk
  # cross-Discovery collisions; safe for a single provider with unique IDs.
  prefix: anthropic
  # disablePrefix: true
  credentialsSecretRef:
    name: anthropic-api-key
  secrets:
    - as: ANTHROPIC_API_KEY
      secretRef:
        name: anthropic-api-key
        key: ANTHROPIC_API_KEY
  params:
    api_key: "{{ANTHROPIC_API_KEY}}"
    rpm: 25
    timeout: 300
    stream_timeout: 60
  filters:
    include: []
    # Canonical-only: drop dated snapshots, keep rolling aliases.
    exclude:
      - ".*-[0-9]{8}$"
  refresh:
    interval: 10m
---
# Bedrock provider — discovery against AWS Bedrock model catalogue in
# the specified region.
#
# Verified 2026-05-22 EKS smoke-test: 17/18 children Ready in
# eu-north-1 with credentials sourced from externalsecret-litellm-bedrock.
# The single rejected child (nova-lite-v1-0) is an upstream LiteLLM /
# AWS allow-list issue, not an operator bug.
#
# Note: Anthropic Claude models are NOT served in eu-north-1; use a
# US/EU-west region (e.g. us-east-1, eu-west-1) for Claude on Bedrock.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMModelDiscovery
metadata:
  name: bedrock
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  type: bedrock
  prefix: bedrock
  region: eu-north-1
  credentialsSecretRef:
    name: bedrock-credentials
  secrets:
    - as: AWS_ACCESS_KEY_ID
      secretRef:
        name: bedrock-credentials
        key: AWS_ACCESS_KEY_ID
    - as: AWS_SECRET_ACCESS_KEY
      secretRef:
        name: bedrock-credentials
        key: AWS_SECRET_ACCESS_KEY
  params:
    aws_access_key_id: "{{AWS_ACCESS_KEY_ID}}"
    aws_secret_access_key: "{{AWS_SECRET_ACCESS_KEY}}"
    rpm: 25
    timeout: 300
    stream_timeout: 60
  filters:
    include: []
    exclude:
      - ".*embed.*"
      - ".*embedding.*"
      - ".*titan.*"
  refresh:
    interval: 10m
---
# Gemini provider — GET https://generativelanguage.googleapis.com/v1beta/models
#
# Verified 2026-05-22: 41 children before filters; the canonical-only
# OpenAI pattern (".*[0-9]$") doesn't apply here either — Gemini uses
# preview/dated suffixes (gemini-3-pro-preview, gemini-2.5-flash-preview-tts).
# Apply provider-specific filters as needed.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMModelDiscovery
metadata:
  name: gemini
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  type: gemini
  prefix: gemini
  credentialsSecretRef:
    name: gemini-api-key
  secrets:
    - as: GEMINI_API_KEY
      secretRef:
        name: gemini-api-key
        key: GEMINI_API_KEY
  params:
    api_key: "{{GEMINI_API_KEY}}"
    rpm: 25
    timeout: 300
    stream_timeout: 60
  filters:
    include: []
    exclude: []
  refresh:
    interval: 10m
---
# KubeAI provider — OpenAI-compatible /v1/models endpoint hosted in
# the cluster (vLLM, ollama, llama.cpp, etc.).
#
# The operator auto-overlays spec.baseUrl into each child's
# spec.params.api_base so inference routing works end-to-end (FIX.txt
# HIGH-2). With the overlay landed in v0.1.2, no api_base is needed in
# params here.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMModelDiscovery
metadata:
  name: kubeai
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  type: kubeai
  prefix: kubeai
  baseUrl: http://kubeai.kubeai.svc/openai/v1
  # KubeAI typically has no authentication when running in-cluster.
  # Provide an empty credentials Secret if your install requires one.
  credentialsSecretRef:
    name: kubeai-credentials
  params:
    rpm: 25
    timeout: 300
    stream_timeout: 60
  filters:
    include: []
    exclude: []
  refresh:
    interval: 10m
