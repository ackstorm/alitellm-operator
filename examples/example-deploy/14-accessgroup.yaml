# LiteLLMAccessGroup — a reusable bundle of models, MCP servers, and A2A
# agents that teams attach through `spec.permission.accessGroups`.
# Requires LiteLLM 1.93.0+ (/v1/access_group).
#
# metadata.name IS the LiteLLM `access_group_name`. The access_group_id is
# SERVER-MINTED, so the operator adopts a pre-existing group by name.
#
# ⚠️ ACCESS GROUPS ONLY ADD — see docs/user-guide/access-group.md.
# A group grant OVERRIDES the attaching team's deny-by-default sentinel
# (`models: ["__deny_all__"]`). Anything listed here is reachable by EVERY
# team that attaches the group, whatever that team's own permission block says.
#
# This is NOT the legacy per-model access-group TAG namespace written via
# `LiteLLMModel.spec.info.access_groups` / `DEFAULT_ACCESS_GROUP`. The two
# namespaces are disjoint: a group created here never appears in
# `GET /access_group/list`.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMAccessGroup
metadata:
  name: shared-tooling
spec:
  description: Models and tools shared across product teams

  # Model NAMES, forwarded verbatim to access_model_names — LiteLLM matches
  # on model_name, so nothing is resolved and no CR reference is required.
  # A name that matches no live model is an inert grant, not an error.
  models:
    - gpt-3.5-turbo

  # MCP server NAMES, resolved to server_id via GET /v1/mcp/server. An
  # unresolved name parks the CR Ready=False reason=MCPServerNotFound and
  # self-heals once the LiteLLMMCPServer exists (ordering dependency).
  mcpServers:
    - exa-mcp                    # matches 04-mcpserver.yaml

  # A2A agent NAMES, resolved to agent_id via GET /v1/agents. Same parking
  # behaviour, reason=AgentNotFound.
  agents: []

  # Orphan (default): if the LiteLLM-side DELETE cannot be confirmed the
  # finalizer still drains. Delete: block until confirmed.
  deletionPolicy: Orphan
---
# Attaching the group WIDENS every team that references it. This team grants
# nothing of its own (`models: []` → the deny-all sentinel), yet its keys can
# still reach gpt-3.5-turbo and exa-mcp through `shared-tooling`.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMTeam
metadata:
  name: example-team-with-group
spec:
  permission:
    models: []
    accessGroups:
      - shared-tooling
