# Team CR — finance team with budget + rate limits, attached to an access
# group. A team is a CONTAINER: it grants nothing by itself. The operator
# always projects it closed (models ["no-default-models"], null-UUID agents,
# [] for every MCP field) and ONLY the attached access groups open it.
#
# Named "finance" — NOT "default". With no Team/default CR the operator keeps
# an implicit LiteLLM team `default` (closed, no access groups).
#
# After apply, expect:
#   (a) status.lastRendered.teamID == metadata.name ("finance") for a team the
#       operator creates; a team that already existed under a server-assigned
#       UUID keeps it (CREATE-only name-id).
#   (b) max_budget=500.0 + budget_duration="30d", rpm_limit=6000 +
#       tpm_limit=1000000 on the POST /team/new body.
#   (c) access_group_ids = [id of LiteLLMAccessGroup "shared-tooling"]
#       (14-accessgroup.yaml). Until that group exists the team parks
#       Ready=False reason=AccessGroupNotFound and heals on its own.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMTeam
metadata:
  name: finance
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  # LiteLLMAccessGroup NAMES — the team's only grant. Groups only ADD.
  accessGroups: ["shared-tooling"]
  # Optional. Absent → max_budget / budget_duration sent as null (cleared).
  budget:
    limit: 500.0
    period: "30d"
  # Optional. Projects onto rpm_limit / tpm_limit; the *_limit_type keys are
  # operator-controlled ("best_effort_throughput").
  rateLimits:
    rpm: 6000
    tpm: 1000000
