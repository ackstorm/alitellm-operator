# Minimal Team CR — no budget, no access groups. The team is projected
# CLOSED (models ["no-default-models"], no access groups): it exists but its
# keys reach nothing until spec.accessGroups attaches a LiteLLMAccessGroup.
#
# Do NOT name this CR `default` unless you mean to take over the implicit
# LiteLLM team `default` the operator keeps (closed, no access groups).
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMTeam
metadata:
  name: example
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec: {}
