# ModelDiscovery sample: Amazon Bedrock
#
# CEL rules exercised:
#   - spec.type=bedrock matches the Enum constraint
#   - regions is REQUIRED for bedrock (region is forbidden)
#   - baseUrl is FORBIDDEN for bedrock
#   - credentialsSecretRef is OPTIONAL (commented variant below shows the
#     IRSA / Pod Identity / EC2-instance-profile path with the field
#     omitted — operator falls back to the default AWS credential chain
#     per D-05)
#   - refresh.interval >= 1m (MDISC-05 floor)
#
# Multi-region: list several regions in order, e.g.
#   regions: [us-east-1, us-west-2]
# Duplicate model IDs across regions resolve to the FIRST region; each
# child's aws_region_name is the region it was found in.
#
# Bedrock model ID example: "anthropic.claude-3-sonnet-20240229-v1:0"
# The `:` between `v1` and `0` is normalized to `-` for the K8s child
# Model's metadata.name (spec §6.3 line 756 — see MDISC-10). The RAW ID
# is preserved verbatim in spec.params.model.
#
# Required Secret keys (when credentialsSecretRef is set):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Optional Secret key:
#   AWS_SESSION_TOKEN (for STS temporary credentials)
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMModelDiscovery
metadata:
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
  name: bedrock-us-east-1
  namespace: default
spec:
  type: bedrock
  regions: [us-east-1]
  prefix: bedrock-use1
  credentialsSecretRef:
    name: aws-bedrock-credentials
  # IRSA variant (operator falls back to default AWS credential chain):
  #   Delete the credentialsSecretRef block above and uncomment nothing —
  #   the operator detects the omission and uses IRSA / Pod Identity /
  #   EC2 instance profile / env-var credentials in that order.
  #   See D-05 + CONTEXT.md <specifics> line 278.
  params:
    rpm: 50
    timeout: 600
  info:
    mode: chat
  refresh:
    interval: 15m
