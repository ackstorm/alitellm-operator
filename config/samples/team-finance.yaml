# Team CR with budget + rate limits, attached to an access group. See
# examples/example-deploy/07-team.yaml for the annotated version.
apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMTeam
metadata:
  name: finance
  namespace: default
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  accessGroups: ["shared-tooling"]
  budget:
    limit: 500.0
    period: "30d"
  rateLimits:
    rpm: 6000
    tpm: 1000000
