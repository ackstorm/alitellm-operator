                  ModelGroup is the model access-group tag the budget applies to.
                  Immutable: a rename would orphan the old tag's budget.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: modelGroup is immutable
                  rule: self == oldSelf
              period:
                description: Period is the reset interval (budget_duration), e.g.
                  `30d`.
