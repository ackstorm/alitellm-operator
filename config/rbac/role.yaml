kind: ClusterRole
metadata:
  name: alitellm-operator-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - litellm.ackstorm.ai
  resources:
  - litellma2aagents
  - litellmconnections
  - litellmguardrails
  - litellmmcpserverdiscoveries
  - litellmmcpservers
  - litellmmodeldiscoveries
  - litellmmodels
  - litellmteams
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - litellm.ackstorm.ai
  resources:
  - litellma2aagents/finalizers
  - litellmconnections/finalizers
  - litellmguardrails/finalizers
  - litellmmcpserverdiscoveries/finalizers
  - litellmmcpservers/finalizers
  - litellmmodeldiscoveries/finalizers
