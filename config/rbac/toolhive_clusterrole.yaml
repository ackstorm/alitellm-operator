# ToolHive cluster-scoped read RBAC (Phase 5 plan 05-02, D-07).
#
# Grants the operator's ServiceAccount read access to ToolHive's
# `toolhive.stacklok.dev/v1beta1` MCPServer + VirtualMCPServer custom
# resources at cluster scope. The cluster-scope grant is intentional
# (per Phase 5 D-07): MCPServerDiscovery CRs may select ToolHive
# objects from ANY namespace via `spec.toolhive.namespaces[]`, and the
# spec §6.5 dotted-naming guarantee
# (`<discovery>.<toolhive-ns>.<toolhive-name>`) requires cross-namespace
# observability.
#
# This file ships UNCONDITIONALLY (per D-07): deployments that never
# instantiate a MCPServerDiscovery still carry the unused permission.
# Blast radius is low — ToolHive objects do not carry secret material
# (status.url is the only sensitive field, and it is published by the
# ToolHive deployment by design).
#
# The ClusterRoleBinding subject `name` MUST match the actual operator
# ServiceAccount. Kustomize's default service_account.yaml does NOT
# apply a `namePrefix` to the SA at this layer (the prefix is applied
# at the kustomize root); this file uses the BASE SA name
# (`controller-manager`) and relies on the kustomize layer above
# (config/default/kustomization.yaml) to prefix it consistently with
# the rest of the RBAC.
#
# Phase 7 (Helm chart) will template the SA name; in v1alpha1 this
# binding follows the controller-manager naming.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alitellm-operator-toolhive-reader
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/component: rbac
rules:
- apiGroups:
  - toolhive.stacklok.dev
  resources:
  - mcpservers
  - virtualmcpservers
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alitellm-operator-toolhive-reader
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alitellm-operator-toolhive-reader
subjects:
- kind: ServiceAccount
  # Base SA name — kustomize's namePrefix at config/default/ resolves
  # this to e.g. `alitellm-operator-controller-manager` at install time.
  name: controller-manager
  # Namespace gets resolved by kustomize at the overlay layer too.
  namespace: system
