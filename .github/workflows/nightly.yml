name: nightly

# Long-running soak + leak + fuzz harnesses on a 04:00 UTC cadence (and on
# demand via workflow_dispatch). Split into parallel jobs so total
# wall-clock is ~max(jobs) instead of sum. Never cancel an in-flight run.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  long-soak:
    name: 35-min AC-R1 cross-kind soak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - uses: actions/setup-go@v6  # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cache Go build + module cache
        uses: actions/cache@v4  # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run 35-min AC-R1 cross-kind soak
        run: make smoke-idempotency-long

  leak-soak:
    name: 1000-reconcile FD+goroutine leak harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - uses: actions/setup-go@v6  # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cache Go build + module cache
        uses: actions/cache@v4  # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run 1000-reconcile leak harness
        run: make leak-soak

  fuzz-long:
    name: Go fuzz (10min per target)
    runs-on: ubuntu-latest
    # 2 targets x 10 min = ~20 min sequential; 45 minutes adds margin for the
    # devtools image cold-build path.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Cache devtools + go caches
        uses: actions/cache@v4  # v4.3.0
        with:
          path: |
            .gocache/build
            .gocache/gopath
          key: ${{ runner.os }}-devtools-${{ hashFiles('**/go.sum', 'Dockerfile.devtools') }}
          restore-keys: ${{ runner.os }}-devtools-

      - name: Build devtools image (cached)
        run: ./scripts/dev.sh true

      - name: Run 10-min fuzz on FuzzSubstitute + FuzzNormalize
        run: ./scripts/dev.sh make fuzz-long

      # On a crash, the fuzzer writes new corpus files under
      # internal/<pkg>/testdata/fuzz/<TargetName>/ for triage.
      # `if-no-files-found: ignore` keeps non-failure runs noise-free.
      - name: Upload fuzz crash corpus
        if: failure()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: fuzz-crashes-${{ github.sha }}
          path: |
            internal/substitution/testdata/fuzz/FuzzSubstitute/**
            internal/normalize/testdata/fuzz/FuzzNormalize/**
          if-no-files-found: ignore
