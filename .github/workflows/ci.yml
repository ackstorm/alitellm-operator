name: ci

# Tiered gating policy + rationale: references/docs/workflow.md.
# PR-only: branch protection on main enforces PR workflow, so the
# pull_request event is the single CI trigger. Each test job mirrors a
# local `make` target via ./scripts/dev.sh.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.planning/**'
      - 'references/**'
      - 'FIX*.txt'
      - 'LICENSE'
      - 'NOTICE'
      - 'CODEOWNERS'
      - '.gitignore'

# main is PR-only (branch protection enforces). Post-merge content equals
# PR head content, so re-running on push main is redundant. Release
# commits are handled by release.yml. Nightly soak/leak/fuzz lives in
# nightly.yml.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run linter
        run: ./scripts/dev.sh make qa-lint

      # Chart/CRD drift gate. `make helm-sync` regenerates CRDs from
      # api/ via controller-gen, rebuilds dist/install.yaml, and copies
      # both into deploy/helm/.../crd-sources + templates/install.yaml.
      # `helm-sync-check` fails if that produces uncommitted diff —
      # catching PRs that change a CRD field or RBAC rule without
      # refreshing the published chart. v0.7.0 shipped stale CRDs for
      # PR #25 (endpoint validation) and PR #38 (DuplicateDiscovery →
      # Conflict rename) because nothing enforced this invariant.
      #
      # build-installer (helm-sync dep) rewrites
      # config/manager/kustomization.yaml's image pin to
      # `controller:latest` as a side effect. Restore the working-tree
      # value before the diff check so the gate only catches real chart
      # drift, not the kustomize image flip.
      - name: Chart / CRD drift (make helm-sync-check)
        run: |
          cp config/manager/kustomization.yaml /tmp/kust-snap.yaml
          ./scripts/dev.sh make helm-sync >/tmp/helm-sync.log 2>&1 || {
            echo "::error::make helm-sync failed"; cat /tmp/helm-sync.log; exit 1; }
          cp /tmp/kust-snap.yaml config/manager/kustomization.yaml
          if ! git diff --quiet -- deploy/helm/alitellm-operator/crd-sources deploy/helm/alitellm-operator/templates/install.yaml; then
            echo "::error::CHART DRIFT: run 'make helm-sync' and commit the result"
            git --no-pager diff --stat -- deploy/helm/alitellm-operator/crd-sources deploy/helm/alitellm-operator/templates/install.yaml
            git --no-pager diff -- deploy/helm/alitellm-operator/crd-sources deploy/helm/alitellm-operator/templates/install.yaml | head -200
            exit 1
          fi
          echo "chart in sync with config/crd"

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run unit tests
        run: ./scripts/dev.sh make test-unit

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-unit
          path: cover-unit.out
          if-no-files-found: warn

  envtest:
    name: Envtest
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run controller + toolhive envtest
        run: ./scripts/dev.sh make test-envtest-fast

      - name: Upload envtest coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-envtest
          path: cover-envtest.out
          if-no-files-found: warn

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Dependency Review
        uses: actions/dependency-review-action@v5  # v4.9.0
        with:
          fail-on-severity: high

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      - name: Run security gate
        run: ./scripts/dev.sh make qa-security

      # gosec SARIF emitted out-of-band for the Security tab; `make
      # security` already gated HIGH findings, so SARIF upload is
      # visibility-only and tolerates failure.
      - name: Generate gosec SARIF
        if: always()
        run: |
          ./scripts/dev.sh bash -c 'go run github.com/securego/gosec/v2/cmd/gosec@v2.22.7 -no-fail -fmt=sarif -out=gosec-results.sarif -exclude-dir=vendor -exclude-dir=.gocache ./...'

      - name: Upload gosec SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  e2e:
    name: E2E (kind + helm + ginkgo)
    runs-on: ubuntu-latest
    needs: [unit, envtest]
    timeout-minutes: 25
    if: "!github.event.pull_request.draft"
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Set up devtools (pull or build)
        uses: ./.github/actions/setup-devtools

      # `make e2e-full` wraps cluster-up + make e2e-run + cluster-down in
      # one bash with trap-guaranteed teardown. GH Actions cannot share
      # a bash trap across steps, so the same semantics are expressed
      # as three steps:
      #   cluster-up       → 'needs: success' (default)
      #   make e2e-run     → 'needs: cluster-up succeeded'
      #   forensics        → 'if: failure()' before cluster-down
      #   cluster-down     → 'if: always()' (trap equivalent)
      - name: Cluster up + hydrate (same as make cluster-up)
        run: ./scripts/dev.sh make cluster-up

      - name: Run E2E suite (same as make e2e-run)
        run: ./scripts/dev.sh make e2e-run

      - name: Collect failure forensics
        if: failure()
        run: ./scripts/dev.sh bash scripts/collect-forensics.sh

      - name: Cluster down (trap equivalent — always runs)
        if: always()
        run: ./scripts/dev.sh make cluster-down

      - name: Upload forensics
        if: failure()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: e2e-forensics
          path: |
            /tmp/e2e-collected/**
