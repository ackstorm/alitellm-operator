name: ci

# Tiered gating policy + rationale: references/docs/workflow.md.
# Per-job `if:` filters below are the authoritative trigger surface.
# Each test job mirrors a local `make` target via ./scripts/dev.sh.

on:
  push:
    branches-ignore: []
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.planning/**'
      - 'references/**'
      - 'FIX*.txt'
      - 'LICENSE'
      - 'NOTICE'
      - 'CODEOWNERS'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.planning/**'
      - 'references/**'
      - 'FIX*.txt'
      - 'LICENSE'
      - 'NOTICE'
      - 'CODEOWNERS'
      - '.gitignore'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): v')"
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Cache devtools + go caches
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            .gocache/build
            .gocache/gopath
          key: ${{ runner.os }}-devtools-${{ hashFiles('**/go.sum', 'Dockerfile.devtools') }}
          restore-keys: ${{ runner.os }}-devtools-

      - name: Build devtools image (cached)
        run: ./scripts/dev.sh true

      - name: Run linter
        run: ./scripts/dev.sh make lint

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): v')"
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Cache devtools + go caches
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            .gocache/build
            .gocache/gopath
          key: ${{ runner.os }}-devtools-${{ hashFiles('**/go.sum', 'Dockerfile.devtools') }}
          restore-keys: ${{ runner.os }}-devtools-

      - name: Build devtools image (cached)
        run: ./scripts/dev.sh true

      - name: Run unit tests
        run: ./scripts/dev.sh make unit

      - name: Upload unit coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-unit
          path: cover-unit.out
          if-no-files-found: warn

  envtest:
    name: Envtest
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release): v'))
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Cache devtools + go caches
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            .gocache/build
            .gocache/gopath
          key: ${{ runner.os }}-devtools-${{ hashFiles('**/go.sum', 'Dockerfile.devtools') }}
          restore-keys: ${{ runner.os }}-devtools-

      - name: Build devtools image (cached)
        run: ./scripts/dev.sh true

      - name: Run controller + toolhive envtest
        run: ./scripts/dev.sh make envtest-fast

      - name: Upload envtest coverage
        if: always()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: cover-envtest
          path: cover-envtest.out
          if-no-files-found: warn

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release): v'))
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4  # v4.9.0
        with:
          fail-on-severity: high

      - name: Cache devtools + go caches
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            .gocache/build
            .gocache/gopath
          key: ${{ runner.os }}-devtools-${{ hashFiles('**/go.sum', 'Dockerfile.devtools') }}
          restore-keys: ${{ runner.os }}-devtools-

      - name: Build devtools image (cached)
        run: ./scripts/dev.sh true

      - name: Run security gate
        run: ./scripts/dev.sh make security

      # gosec SARIF emitted out-of-band for the Security tab; `make
      # security` already gated HIGH findings, so SARIF upload is
      # visibility-only and tolerates failure.
      - name: Generate gosec SARIF
        if: always()
        run: |
          ./scripts/dev.sh bash -c 'go run github.com/securego/gosec/v2/cmd/gosec@v2.22.7 -no-fail -fmt=sarif -out=gosec-results.sarif -exclude-dir=vendor -exclude-dir=.gocache ./...'

      - name: Upload gosec SARIF to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  e2e:
    name: E2E (kind + helm + ginkgo)
    runs-on: ubuntu-latest
    needs: [unit, envtest]
    timeout-minutes: 25
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v6  # v4.3.1

      - name: Cache devtools + go caches
        uses: actions/cache@v5  # v4.3.0
        with:
          path: |
            .gocache/build
            .gocache/gopath
          key: ${{ runner.os }}-devtools-${{ hashFiles('**/go.sum', 'Dockerfile.devtools') }}
          restore-keys: ${{ runner.os }}-devtools-

      - name: Build devtools image (cached)
        run: ./scripts/dev.sh true

      # `make e2e-full` wraps cluster-up + make e2e + cluster-down in
      # one bash with trap-guaranteed teardown. GH Actions cannot share
      # a bash trap across steps, so the same semantics are expressed
      # as three steps:
      #   cluster-up       → 'needs: success' (default)
      #   make e2e         → 'needs: cluster-up succeeded'
      #   forensics        → 'if: failure()' before cluster-down
      #   cluster-down     → 'if: always()' (trap equivalent)
      - name: Cluster up + hydrate (same as make cluster-up)
        run: ./scripts/dev.sh make cluster-up

      - name: Run E2E suite (same as make e2e)
        run: ./scripts/dev.sh make e2e

      - name: Collect failure forensics
        if: failure()
        run: ./scripts/dev.sh bash scripts/collect-forensics.sh

      - name: Cluster down (trap equivalent — always runs)
        if: always()
        run: ./scripts/dev.sh make cluster-down

      - name: Upload forensics
        if: failure()
        uses: actions/upload-artifact@v7  # v4.6.2
        with:
          name: e2e-forensics
          path: |
            /tmp/e2e-collected/**
