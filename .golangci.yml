version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # Composite literals (request bodies, table tests) repeat keys by design.
      exclude-types:
        - Call
        - CompositeLit
    staticcheck:
      # Correctness (SA) and simplification (S1) only; no style or quick-fix checks.
      checks:
        - SA*
        - S1*
    gosec:
      includes:
        - G101
        - G102
        - G103
        - G104
        - G106
        - G107
        - G108
        - G109
        - G110
        - G201
        - G202
        - G203
        - G204
        - G304
        - G401
        - G402
        - G403
        - G404
        - G501
        - G502
        - G503
        - G504
        - G505
      severity: high
      confidence: low
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Test literals repeat on purpose.
      - linters:
          - goconst
        path: _test\.go
      # Fixture placeholders, not credentials.
      - linters:
          - gosec
        path: _test\.go
        text: G101
      # A test waiting on a done channel does not assert the error it carries.
      - linters:
          - errcheck
        path: _test\.go
        source: "case <-"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
