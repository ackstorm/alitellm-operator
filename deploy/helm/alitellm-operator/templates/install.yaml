apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: workspace
    control-plane: alitellm-operator
  name: alitellm-operator-metrics
  namespace: {{ .Release.Namespace }}
spec:
