  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: workspace
    control-plane: alitellm-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: workspace
    control-plane: alitellm-operator
  name: alitellm-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workspace
      control-plane: alitellm-operator
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: workspace
        control-plane: alitellm-operator
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8080
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /alitellm-operator
        env:
        - name: WATCH_NAMESPACE
          value: {{ .Values.watchNamespace }}
        {{- if .Values.safetyRelistInterval }}
        - name: LITELLM_OPERATOR_SAFETY_RELIST_INTERVAL
          value: {{ .Values.safetyRelistInterval | quote }}
        {{- end }}
        {{- range .Values.extraEnv }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        image: {{ .Values.image.repo }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports: []
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: alitellm-operator
      terminationGracePeriodSeconds: 10
      volumes: []

---
{{- if .Values.metrics.serviceMonitor.enabled }}
# ServiceMonitor stub — generated by scripts/kustomize-to-helm.sh (plan 07-02 D-02).
# This block is activated when metrics.serviceMonitor.enabled=true.
# When prometheus-operator is installed and a ServiceMonitor is added to
# config/default/prometheus/ and included in config/default/kustomization.yaml,
# `make helm-sync` will replace this stub with the rendered ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alitellm-operator-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: helm
spec:
  selector:
    matchLabels:
      control-plane: alitellm-operator
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
