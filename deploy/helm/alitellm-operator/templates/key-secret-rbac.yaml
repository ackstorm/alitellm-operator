{{- if .Values.keySecretNamespaces }}
# Secret access for LiteLLMKey, one RoleBinding per namespace in
# keySecretNamespaces. The ClusterRole only carries the rules; nothing binds
# it cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alitellm-operator-key-secrets
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - delete
{{- range .Values.keySecretNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alitellm-operator-key-secrets
  namespace: {{ . | quote }}
  labels:
    app.kubernetes.io/name: alitellm-operator
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alitellm-operator-key-secrets
subjects:
- kind: ServiceAccount
  name: alitellm-operator
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
