---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.17.0
  name: litellmkeys.litellm.ackstorm.ai
spec:
  group: litellm.ackstorm.ai
  names:
    categories:
    - litellm
    kind: LiteLLMKey
    listKind: LiteLLMKeyList
    plural: litellmkeys
    shortNames:
    - llmk
    singular: litellmkey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.secretRef.namespace
      name: SecretNamespace
      type: string
    - jsonPath: .spec.secretRef.name
      name: Secret
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LiteLLMKey is the Schema for the litellmkeys API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KeySpec declares a LiteLLM virtual key with no user and no
              team.
            properties:
              budget:
                description: Budget caps the key's spend (max_budget, budget_duration).
                properties:
                  limit:
                    description: |-
                      Limit is the USD budget cap for the LiteLLM team, projected
                      verbatim onto `max_budget` (number). Modeled as `*float64` so the
                      reconciler can distinguish "user set 0.0" from "user omitted the
                      field" — the former projects to `max_budget: 0.0`, the latter to
                      `max_budget: null` (per spec §6.7 "Clearing budget").
                    type: number
                  period:
                    description: |-
                      Period is the budget reset interval as a duration string, projected
                      verbatim onto `budget_duration` (string). CEL admission rejects any
                      value that does not match `^[0-9]+[smhd]$` (seconds | minutes |
                      hours | days — per spec §6.7). MinLength=1 is NOT applied
                      independently: the regex pattern + `omitempty` together cover
                      absence (no pattern check fires when the field is absent), and a
                      present-but-empty value (`""`) is rejected by the regex itself.
                    pattern: ^[0-9]+[smhd]$
                    type: string
                type: object
              deletionPolicy:
                default: Orphan
                description: |-
                  DeletionPolicy controls finalizer behavior when the LiteLLM-side DELETE
                  cannot be confirmed. Defaults to "Orphan" per REL-06 anti-storm.
                enum:
                - Orphan
                - Delete
                type: string
              models:
                description: |-
                  Models the key may call, projected onto `models`. LiteLLM model names
                  or LiteLLMModelAlias names; not validated against LiteLLM. At least
                  one is required: a teamless key with no models can call every model.
                items:
                  minLength: 1
                  type: string
                minItems: 1
                type: array
              rateLimits:
                description: RateLimits caps the key's request and token rate (rpm_limit,
                  tpm_limit).
                properties:
                  rpm:
                    description: |-
                      RPM is the requests-per-minute cap, projected verbatim onto
                      `rpm_limit` (integer) on the POST /team/{new,update} body. Modeled
                      as `*int32` so the reconciler can distinguish `0` (explicit zero —
                      projects to `rpm_limit: 0` + `rpm_limit_type: "best_effort_throughput"`)
                      from omitted (user did not set the field — projection emits
                      `rpm_limit: null` and OMITS `rpm_limit_type` per Feature 01 §2.1).
                    format: int32
                    minimum: 0
                    type: integer
                  tpm:
                    description: |-
                      TPM is the tokens-per-minute cap, projected verbatim onto
                      `tpm_limit` (integer) on the POST /team/{new,update} body. Modeled
                      as `*int32` so the reconciler can distinguish `0` (explicit zero —
                      projects to `tpm_limit: 0` + `tpm_limit_type: "best_effort_throughput"`)
                      from omitted (user did not set the field — projection emits
                      `tpm_limit: null` and OMITS `tpm_limit_type` per Feature 01 §2.1).
                    format: int32
                    minimum: 0
                    type: integer
                type: object
              secretRef:
                description: |-
                  SecretRef is where the key value is written. Immutable: to move the
                  Secret, delete and recreate the LiteLLMKey.
                properties:
                  key:
                    description: Key is the entry inside the Secret's data that holds
                      the key value.
                    minLength: 1
                    type: string
                  name:
                    description: |-
                      Name of the Secret. The operator creates it and refuses one it did
                      not create.
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace of the Secret. The operator needs get/create/delete on
                      Secrets there (Helm value keySecretNamespaces).
                    minLength: 1
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
                x-kubernetes-validations:
                - message: secretRef is immutable
                  rule: self == oldSelf
            required:
            - models
            - secretRef
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions: single type `Ready`, reasons Synced, LiteLLMUnavailable,
                  LiteLLMRejected, SecretAccessDenied, SecretNotOwned, Conflict.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastRendered:
                description: |-
                  KeyLastRenderedStatus records what was last applied to LiteLLM. It never
                  holds the key value.
                properties:
                  at:
                    format: date-time
                    type: string
                  hash:
                    description: Hash is the SHA-256 of the rendered models, budget
                      and limits.
                    type: string
                  keyAlias:
                    description: KeyAlias is the key's alias in LiteLLM (metadata.name).
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
