# deploy/helm/alitellm-operator/values.yaml
#
# Plan 07-02 (D-02): exactly 4 parameterized surfaces. Extended by Tier 2
# plan amendment A5 (2026-05-19) to add `extraEnv` and `resources` so the
# Tier 2 test environment can override SAFETY_RELIST_INTERVAL, LOG_LEVEL,
# and resource limits without bypassing the shipping chart. Defaults below
# preserve the original kustomize behavior — production installs that don't
# set these surfaces render identically to the pre-A5 chart.
#
# Other knobs (replica count, node selector, tolerations, affinity,
# security context, leader-election toggle) remain kustomize-locked. To
# expose additional knobs, edit `scripts/kustomize-to-helm.sh` + this file
# and run `make helm-sync`.
#
# Re-enable trigger: a dogfood install surfaces a need → add the surface
# here + `helm-sync` regen.

# installCRDs: when true (default), the chart ships every CRD in
# crd-sources/ as a managed Helm resource (rendered via templates/crds.yaml).
# `helm upgrade` then upgrades CRDs the same way it upgrades every other
# resource — no more manual `kubectl apply -f crds/` dance.
#
# Each CRD carries `helm.sh/resource-policy: keep` so `helm uninstall`
# preserves them (and the user's CRs) intact. Set this to false when
# CRDs are managed out-of-band (Flux/ArgoCD Kustomization, kubectl apply
# in a CD pipeline, etc.) to avoid Helm tracking two owners for the
# same object.
installCRDs: true
image:
  # Container registry + image name. Matches the ghcr.io/ackstorm/ OCI
  # artifact pushed by the release.yml workflow.
  repo: ghcr.io/ackstorm/alitellm-operator
  # Tag to deploy. Bumped automatically by release CI on tag push.
  tag: v0.8.3
  # Pull policy. IfNotPresent is appropriate for pinned tags.
  pullPolicy: IfNotPresent
# watchNamespace is the Kubernetes namespace the operator watches for CRs.
# Maps to the WATCH_NAMESPACE env var on the manager Deployment.
# Per spec §4 / SCOPE-04: CRs in any other namespace are never reconciled.
#
# Empty (default) → the operator watches its own install namespace
# (.Release.Namespace). WATCH_NAMESPACE also pins the leader-election
# lease and the LiteLLMConnection/default singleton, while the chart
# binds RBAC in .Release.Namespace — so watchNamespace MUST equal the
# install namespace. Leaving this empty keeps them aligned automatically;
# `helm install -n litellm-system` then watches litellm-system with no
# extra flag. Set explicitly ONLY if you deliberately watch a namespace
# other than the one the operator is installed into (requires matching
# RBAC in that namespace — not provisioned by this chart).
watchNamespace: ""
toolhive:
  # enabled=true (default) includes the ClusterRole + ClusterRoleBinding
  # that grants the operator read access to ToolHive MCPServer +
  # VirtualMCPServer objects (Phase 5 D-07). Set to false on clusters
  # without ToolHive — the lazy informer (Phase 5 D-08) silently retries
  # when CRDs are absent. Note: with RBAC stripped, MCPServerDiscovery CRs
  # will surface Ready=False, reason=SourceUnreachable, message="ToolHive
  # RBAC missing" if ToolHive CRDs are installed but RBAC is absent.
  enabled: true
metrics:
  serviceMonitor:
    # enabled=false (default): the prometheus-operator ServiceMonitor CR is
    # not rendered. Set to true when prometheus-operator is installed in the
    # cluster. See deploy/helm/alitellm-operator/templates/install.yaml for the
    # stub block that is activated when this value is true.
    enabled: false
  # metrics.dashboards: ship the Grafana dashboards
  # (templates/grafana-dashboards.yaml) as one ConfigMap per dashboard, labelled
  # for the kube-prometheus-stack Grafana sidecar to auto-load. Needs NO
  # Prometheus Operator CRD — plain ConfigMaps — so it is safe to enable
  # wherever that sidecar runs (sidecar.dashboards.enabled=true is the
  # kube-prometheus-stack default). The JSON lives in the chart's
  # dashboards/<group>/ dirs, mirrored from examples/grafana by `make helm-sync`.
  #
  # Groups: `operator` = metrics this operator emits; `litellm` = the LiteLLM
  # proxy's own callback metrics plus the litellm-exporter's DB-derived ones.
  # The LiteLLM dashboards render only where a LiteLLM proxy is scraped.
  dashboards:
    enabled: false
    # label/labelValue: must match the sidecar's LABEL/LABEL_VALUE
    # (kube-prometheus-stack defaults: grafana_dashboard / "1").
    label: grafana_dashboard
    labelValue: "1"
    # folders: per-group Grafana folder, keyed by the dashboards/<group>/ dir.
    # Honoured only when the sidecar runs with
    # sidecar.dashboards.folderAnnotation=grafana_folder.
    folders:
      operator: aLiteLLM Operator
      litellm: aLiteLLM
    # folder: fallback for a group with no entry above. Empty → no annotation,
    # so the dashboard lands in the sidecar provider's default folder.
    folder: aLiteLLM
    # labels: extra labels on every dashboard ConfigMap.
    labels: {}
  # metrics.prometheusRule: ship alerting rules (templates/prometheus-rules.yaml)
  # for the failure modes the operator dashboard's "Is it healthy?" row
  # surfaces: operator down, LiteLLM connection not Ready, sustained reconcile
  # errors, CRs failing to sync, stale CR status, deletions blocked, discovery
  # failing. Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
  # The alitellm_operator_* expressions need operator >= v0.7.29.
  prometheusRule:
    enabled: false
    # labels: extra labels on the PrometheusRule object — e.g. whatever your
    # Prometheus's ruleSelector matches (kube-prometheus-stack default:
    # release: <prom-release-name>).
    labels: {}
# safetyRelistInterval (v0.4.6+) overrides the per-reconciler vanish-probe
# cadence shared by MCPServer / Model / Team / A2AAgent. Accepts any
# time.ParseDuration string ("10s", "1m", "30m", "1h"). Empty / unset →
# operator default 10m (v0.4.7+). Floor: 5s (sub-floor values are rejected
# at operator startup with a fatal error — sub-5s is reconcile-storm risk
# per v0.4.4 root-cause analysis).
#
# Maps to LITELLM_OPERATOR_SAFETY_RELIST_INTERVAL on the manager Deployment.
# Tier 2 / dev clusters with small CR counts (≤10) can drop to 10s for
# faster drift recovery. Tier 1 prod with 100+ CRs can raise to 30m–1h
# to trade recovery latency for less LiteLLM API load (the operator
# also re-reconciles on every spec edit + Secret rotation + Connection
# recovery — safety-relist is only the floor for purely external drift).
safetyRelistInterval: ""
# extraEnv: list of additional environment variables to inject into the manager
# container, AFTER the WATCH_NAMESPACE entry. Each item is {name, value}.
#
# Use safetyRelistInterval above for the most common knob; extraEnv is
# the escape hatch for anything else (LITELLM_OPERATOR_LOG_LEVEL,
# LITELLM_OPERATOR_RECREATE_LIMIT_PER_MIN, DEFAULT_ACCESS_GROUP, etc.).
# Production installs that want defaults can leave this empty.
#
# DEFAULT_ACCESS_GROUP names the access group injected into a model's
# model_info.access_groups when it declares none (default "default"; set ""
# to disable injection). See CLAUDE.md "Model created with no access group".
#
# Example:
#   extraEnv:
#     - name: LITELLM_OPERATOR_LOG_LEVEL
#       value: "debug"
#     - name: DEFAULT_ACCESS_GROUP
#       value: "default"
#     # Hard-reject a plaintext http:// endpoint on a REMOTE LiteLLM
#     # (in-cluster *.svc / loopback endpoints stay exempt). Default:
#     # warn-only log marker MasterKeyOverPlaintextHTTP.
#     - name: LITELLM_OPERATOR_REQUIRE_HTTPS_REMOTE
#       value: "true"
extraEnv: []
# resources: manager container resource requests and limits.
#
# Defaults below mirror the original kustomize values (config/manager/manager.yaml)
# so production installs render identically to the pre-A5 chart. Override in
# values files when running on resource-constrained nodes (or to give the
# operator more headroom in a busy cluster).
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
