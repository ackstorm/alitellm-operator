apiVersion: litellm.ackstorm.ai/v1alpha1
kind: LiteLLMConnection
metadata:
  name: default
  namespace: default
spec:
  # NOTE: CR field is `endpoint`, not `baseUrl` (plan typo — see CR shape in
  # api/litellm/v1alpha1/litellmconnection_types.go).
  endpoint: http://litellm.litellm-system.svc.cluster.local:4000
  masterKeySecretRef:
    name: litellm-master-key
    key: master-key
  # The e2e LiteLLM Helm values set MCP_TOOL_PREFIX_SEPARATOR="." (see
  # test/e2e/values/litellm.values.yaml), so '.' is forbidden inside
  # server_name and '-' is allowed. Tell the operator's wire-side
  # sanitizer (FIX.txt H-1) to match by rewriting '.' → '-'.
  mcpToolPrefixSeparator: "."
