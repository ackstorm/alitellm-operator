apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    provider: {{ .Values.provider }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        provider: {{ .Values.provider }}
    spec:
      containers:
        - name: mock
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MOCK_PROVIDER
              value: {{ .Values.provider | quote }}
            - name: MOCK_AUTH_MODE
              value: {{ .Values.authMode | quote }}
            - name: MOCK_LISTEN_ADDR
              value: ":8080"
            {{- if .Values.fixtures.modelsJSON }}
            - name: MOCK_FIXTURE_PATH
              value: "/fixtures/models.json"
          volumeMounts:
            - name: fixtures
              mountPath: /fixtures
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
      {{- if .Values.fixtures.modelsJSON }}
      volumes:
        - name: fixtures
          configMap:
            name: {{ .Release.Name }}-fixtures
      {{- end }}
