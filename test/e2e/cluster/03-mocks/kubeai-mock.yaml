apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeai-mock
  namespace: mocks
  labels:
    app: kubeai-mock
    provider: kubeai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeai-mock
  template:
    metadata:
      labels:
        app: kubeai-mock
        provider: kubeai
    spec:
      containers:
        - name: mock
          image: litellm-mock:e2e
          imagePullPolicy: Never
          env:
            - name: MOCK_PROVIDER
              value: "kubeai"
            - name: MOCK_AUTH_MODE
              value: "accept"
            - name: MOCK_LISTEN_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: kubeai-mock
  namespace: mocks
spec:
  type: ClusterIP
  selector:
    app: kubeai-mock
  ports:
    - name: http
      port: 8080
      targetPort: 8080
